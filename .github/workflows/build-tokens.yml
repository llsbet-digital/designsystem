name: Build Design Tokens

on:
  push:
    branches: [main]
    paths:
      - 'tokens/**'
  pull_request:
    paths:
      - 'tokens/**'
  workflow_dispatch:

jobs:
  build:
    name: Build tokens
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run build

      - name: Commit build output
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: rebuild tokens [skip ci]'
          file_pattern: 'build/**'
